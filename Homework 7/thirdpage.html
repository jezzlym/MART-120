<html>

<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .navbar-custom .navbar-text {
            color: black
        }

        input:invalid {
            border-color: red;
        }

    </style>
    <script>

    </script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light navbar-custom navbar-text">
        <h4>
            <a href="homepage.html" style="text-decoration:none">Homepage</a>
            <a href="secondpage.html" style="text-decoration:none">Second Page</a>
            <a href="thirdpage.html" style="text-decoration:none">Third Page</a>
        </h4>
    </nav>

    <br />
    <h3>Contact Us</h3>
    <form class="form-group" method="POST" id="myForm">
        <label for="fName">First Name</label>
        <input type="text" class="form-control" id="fName" required> <br />
        <label for="lName">Last Name</label>
        <input type="text" class="form-control" id="lName" required> <br />
        <label for="email">Email:</label>
        <input type="email" class="form-control" id="email" required> <br />
        <br />
        <h4>Terms of Agreement</h4>
        <p>By submitting this we will have your contact info and can send you all the marketing and spam.</p>
        <input type="radio" class="form-check-input" name="agreement" id="agreeYes" value="yes" required>Yes
        <input type="radio" class="form-check-input" name="agreement" id="agreeNo" value="no" required>No
        <br />
        <button class="btn btn-light" id="mySubmit" type="submit" onClick="formValidate()">Submit</button>
    </form>

</body>

</html>
